let metric='anomalia', index=0, timer=null;
const $=id=>document.getElementById(id);
const keys=()=>Object.keys(frames[metric]).sort();
function render(){const months=keys();if(!months.length){$('status').textContent='No hay fotogramas para este indicador';$('frame').removeAttribute('src');return;}
 index=Math.max(0,Math.min(index,months.length-1));const month=months[index];
 $('slider').max=months.length-1;$('slider').value=index;$('date').textContent=month.slice(0,4)+'-'+month.slice(4);
 $('first').textContent=months[0].slice(0,4)+'-'+months[0].slice(4);
 $('status').textContent=(index+1)+' de '+months.length+' meses';$('frame').src=frames[metric][month];
 $('prev').disabled=index===0;$('next').disabled=index===months.length-1;}
function pause(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='▶ Reproducir';}
function play(){if(timer!==null){pause();return;}if(index>=keys().length-1)index=0;render();
 $('play').textContent='❚❚ Pausar';timer=setInterval(()=>{if(index>=keys().length-1){pause();return;}index++;render();},Number($('speed').value));}
$('metric').addEventListener('change',e=>{pause();const current=keys()[index];metric=e.target.value;
 const months=keys();index=Math.max(0,months.indexOf(current));render();});
$('slider').addEventListener('input',e=>{pause();index=Number(e.target.value);render();});
$('prev').addEventListener('click',()=>{pause();index--;render();});
$('next').addEventListener('click',()=>{pause();index++;render();});
$('play').addEventListener('click',play);
$('speed').addEventListener('change',()=>{if(timer!==null){pause();play();}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;
 if(e.key==='ArrowLeft'){pause();index--;render();}else if(e.key==='ArrowRight'){pause();index++;render();}else if(e.code==='Space'){e.preventDefault();play();}});
if(!keys().length && Object.keys(frames.deficit).length)metric='deficit';$('metric').value=metric;
render();
